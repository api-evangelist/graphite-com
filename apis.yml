name: Graphite
kind: company
description: Graphite is a code review platform built on top of GitHub for stacking pull requests, AI
  code review, and merging at scale. The gt CLI creates and submits stacked PRs, Graphite Agent (Diamond)
  provides codebase-aware AI review and chat, and a merge queue batches and tests PRs in parallel. Graphite
  has no standalone public REST API - it integrates through a GitHub App that consumes GitHub webhooks,
  the gt CLI (authenticated with a Graphite token), the GT MCP server, and label / GitHub-mediated integrations
  (Slack, Linear, external merge queue).
